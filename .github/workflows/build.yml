name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK and render face previews
        run: |
          set -o pipefail
          chmod +x gradlew && ./gradlew --no-daemon assembleDebug testDebugUnitTest 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews
          retention-days: 2
          path: app/build/previews
      - uses: actions/upload-artifact@v4
        with:
          name: speedoclock-debug-apk
          retention-days: 2
          path: app/build/outputs/apk/debug/*.apk
      # Readable without logging in: the failing build's log goes to the ci-log branch.
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir -p /tmp/log && grep -E "^e: |error:|FAILED|Exception|expected|at fi\.vihersalo" build.log | head -200 > /tmp/log/errors.txt || true
          tail -300 build.log > /tmp/log/tail.txt
          find app/build/test-results -name "*.xml" -exec grep -l "<failure" {} \; 2>/dev/null | xargs -r cp -t /tmp/log/ || true
          cd /tmp/log
          git init -q -b ci-log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Build log for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log

      - name: Publish previews to the previews branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/pv && cp app/build/previews/*.png /tmp/pv/
          cd /tmp/pv
          git init -q -b previews
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Previews for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" previews

  # Keeps only the newest build files: deletes earlier runs' copies of what this run uploaded
  # (Actions storage is 0.5 GB on the free plan, shared by every repo).
  tidy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete older build files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -q '.artifacts[].name')
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate \
            -q ".artifacts[] | select(.workflow_run.id < $GITHUB_RUN_ID) | \"\(.id) \(.name)\"" |
          while read -r id name; do
            if printf '%s\n' "$names" | grep -qxF "$name"; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "deleted $name ($id)"
            fi
          done
