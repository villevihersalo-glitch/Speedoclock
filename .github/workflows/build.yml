name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK and render face previews
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews
          path: app/build/previews
      - uses: actions/upload-artifact@v4
        with:
          name: speedoclock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
