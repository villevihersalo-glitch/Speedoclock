name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK and render face previews
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews
          path: app/build/previews
      - uses: actions/upload-artifact@v4
        with:
          name: speedoclock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish previews to the previews branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/pv && cp app/build/previews/*.png /tmp/pv/
          cd /tmp/pv
          git init -q -b previews
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Previews for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" previews
